<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XtrudeInc || Product Configurator</title>
    <script
      type="module"
      src="https://unpkg.com/three@0.152.2/build/three.module.js"
    ></script>

    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/dynamic.js"></script>
    <link rel="stylesheet" href="./css/stylesheet.css" />
  </head>
  <body>
    <header id="headerSection">
      <div class="logoContainer">
        <img
          src="./img/XtrudeIncLogoUpdated.png"
          class="logoImg"
          id="logoXtrudeInc"
        />
      </div>
      <p class="SiteHeading">3D Product Configurator</p>
    </header>

    <section>
      <div class="modelContainer">
        <model-viewer
          src="./Models/mini3DBenchy.glb"
          alt="DummyModel"
          id="modelViewer"
          auto-rotate
          disable-zoom
          camera-controls
          background-color="#ffffff"
          style="width: 700px; height: 500px"
          shadow-intensity="1"
          shadow-softness="0.9"
        >
        </model-viewer>
      </div>
      <div class="configuratorContent">
        <div class="TextEditor">
          <h2 class="inputHeading">Text:</h2>
          <input
            type="text"
            placeholder="Enter text here"
            class="textInput"
            id="textInput"
          />
        </div>
        <button type="button" class="ApplyBtn" id="ApplyBtn">
          Apply Changes
        </button>
      </div>
    </section>
  </body>
</html>
