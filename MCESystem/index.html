<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xtrude | MCE Home</title>
    <script src="../MCESystem/JS/dynamic.js"></script>
    <link rel="stylesheet" href="../MCESystem/CSS/stylesheet.css" />
  </head>
  <body>
    <div class="dashboard-container">
      <h2 class="dashboard-title">Welcome to the MCE Dashboard!</h2>
      <h3 class="dashboard-subtext">Please select an option down below</h3>
      <div class="dashboard-btns">
        <button class="dashboard-button" id="Opt1">Single color prints</button>
        <button class="dashboard-button" id="Opt2">Multi color prints</button>
      </div>
    </div>

    <div class="Opt1editor">
      <h2 class="subtitle" id="MatCost">Material cost:</h2>
      <h2 class="subtitle" id="Ecost">Electricity cost:</h2>
      <h2 class="subtitle" id="DesCost">Design/Modelling cost:</h2>
      <h2 class="subtitle" id="DepCost">Machine usage cost/Depreciation:</h2>
      <h2 class="subtitle" id="LaborCost">Labor and Handling/Assembly cost:</h2>
      <h2 class="subtitle" id="PackCost">Packaging cost:</h2>
      <h2 class="subtitle" id="DelCost">Delivery cost:</h2>
      <h2 class="subtitle" id="ProfMarg">Profit margin:</h2>
      <h2 class="subtitle" id="OptCharges">Optional charges:</h2>
    </div>
  </body>
</html>
